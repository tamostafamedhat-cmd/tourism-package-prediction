name: Tourism MLOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Data preparation
        run: |
          python src/data_prep.py

      - name: Train and evaluate model
        run: |
          python src/train_model.py

      - name: Upload dataset files to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi

          api = HfApi(token="${{ secrets.HF_TOKEN }}")
          repo_id = "mosmed/tourism-package-prediction"

          for filename in ["tourism.csv", "train.csv", "test.csv"]:
              api.upload_file(
                  path_or_fileobj=f"data/{filename}",
                  path_in_repo=filename,
                  repo_id=repo_id,
                  repo_type="dataset"
              )
          PY

      - name: Upload best model to Hugging Face Model Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi

          api = HfApi(token="${{ secrets.HF_TOKEN }}")
          repo_id = "mosmed/tourism-package-prediction-model"

          api.upload_file(
              path_or_fileobj="outputs/best_model.joblib",
              path_in_repo="best_model.joblib",
              repo_id=repo_id,
              repo_type="model"
          )

          api.upload_file(
              path_or_fileobj="outputs/model_results.json",
              path_in_repo="model_results.json",
              repo_id=repo_id,
              repo_type="model"
          )
          PY

      - name: Deploy Streamlit app to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi

          api = HfApi(token="${{ secrets.HF_TOKEN }}")
          repo_id = "mosmed/tourism-package-prediction-app"

          files = {
              "app.py": "app.py",
              "Dockerfile": "Dockerfile",
              "requirements.txt": "requirements.txt",
              "outputs/best_model.joblib": "best_model.joblib"
          }

          for local_file, space_file in files.items():
              api.upload_file(
                  path_or_fileobj=local_file,
                  path_in_repo=space_file,
                  repo_id=repo_id,
                  repo_type="space"
              )
          PY

      - name: Commit generated outputs back to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/train.csv data/test.csv outputs/best_model.joblib outputs/model_results.json
          git commit -m "Update MLOps pipeline outputs [skip ci]" || echo "No changes to commit"
          git push
