name: Tourism MLOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Data preparation
        run: |
          python data_prep.py

      - name: Train and evaluate model
        run: |
          python train_model.py

      - name: Upload dataset files to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi

          api = HfApi(token="${{ secrets.HF_TOKEN }}")
          repo_id = "mosmed/tourism-package-prediction"

          api.upload_file(
              path_or_fileobj="tourism.csv",
              path_in_repo="tourism.csv",
              repo_id=repo_id,
              repo_type="dataset"
          )

          api.upload_file(
              path_or_fileobj="train.csv",
              path_in_repo="train.csv",
              repo_id=repo_id,
              repo_type="dataset"
          )

          api.upload_file(
              path_or_fileobj="test.csv",
              path_in_repo="test.csv",
              repo_id=repo_id,
              repo_type="dataset"
          )
          PY

      - name: Upload best model to Hugging Face Model Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi

          api = HfApi(token="${{ secrets.HF_TOKEN }}")
          repo_id = "mosmed/tourism-package-prediction-model"

          api.upload_file(
              path_or_fileobj="best_model.joblib",
              path_in_repo="best_model.joblib",
              repo_id=repo_id,
              repo_type="model"
          )

          api.upload_file(
              path_or_fileobj="model_results.json",
              path_in_repo="model_results.json",
              repo_id=repo_id,
              repo_type="model"
          )
          PY

      - name: Deploy Streamlit app to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          from huggingface_hub import HfApi

          api = HfApi(token="${{ secrets.HF_TOKEN }}")
          repo_id = "mosmed/tourism-package-prediction-app"

          files = [
              "app.py",
              "Dockerfile",
              "requirements.txt",
              "best_model.joblib"
          ]

          for file in files:
              api.upload_file(
                  path_or_fileobj=file,
                  path_in_repo=file,
                  repo_id=repo_id,
                  repo_type="space"
              )
          PY

      - name: Commit generated files back to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add train.csv test.csv best_model.joblib model_results.json
          git commit -m "Update MLOps pipeline outputs" || echo "No changes to commit"
          git push
